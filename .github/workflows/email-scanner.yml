name: Email auto-answer scanner

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort and runs late under
    # load, so treat this as "roughly every 15-30 minutes".
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compose replies but send nothing"
        type: boolean
        default: false

# Never let two sweeps overlap — concurrent runs could both reply to the same
# thread before either sees the other's reply.
concurrency:
  group: email-scanner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r scanner/requirements.txt

      - name: Run sweep
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WATCHED_SENDER: ${{ vars.WATCHED_SENDER || 's036407@students.lmsd.org' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python -m scanner.main
